<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b0f1a;
        --accent: #3b82f6;
        --ink: #ffffff;
        --ink-dim: #9fb0c9;
        --font-display: "Helvetica Neue", Arial, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
      }
      #glow {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 900px;
        height: 900px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
        opacity: 0;
        filter: blur(40px);
      }
      #title {
        color: var(--ink);
        font-size: 128px;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -0.03em;
        opacity: 0;
      }
      #subtitle {
        margin-top: 56px;
        color: var(--ink-dim);
        font-size: 40px;
        line-height: 1;
        font-weight: 400;
        letter-spacing: 0.01em;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div id="glow" class="clip" data-start="0" data-duration="8" data-track-index="0"></div>
      <h1 id="title" class="clip" data-start="0" data-duration="8" data-track-index="1">SISMO</h1>
      <p
        id="subtitle"
        class="clip"
        data-start="0"
        data-duration="8"
        data-track-index="2"
        data-layout-allow-overlap
      >
        Powered by HyperFrames
      </p>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#glow", { opacity: 0, scale: 0.6 }, { opacity: 0.5, scale: 1, duration: 2, ease: "power2.out" }, 0);
      tl.fromTo(
        "#title",
        { opacity: 0, y: 40, filter: "blur(12px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 1, ease: "power4.out" },
        0.3
      );
      tl.fromTo("#subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 1);
      tl.to("#title", { opacity: 0, y: -20, duration: 0.6, ease: "power2.in" }, 6.5);
      tl.to("#subtitle", { opacity: 0, y: -10, duration: 0.6, ease: "power2.in" }, 6.5);
      tl.to("#glow", { opacity: 0, duration: 0.8, ease: "power2.in" }, 6.8);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
